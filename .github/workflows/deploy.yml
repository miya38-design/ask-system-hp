name: Deploy to server (FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # お名前.comは通常FTPS(明示)対応。うまくいかない場合は Secrets に
          # FTP_PROTOCOL=ftp（平文）または ftps-legacy を設定して上書き。
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          local-dir: ./public/
          # 公開ディレクトリのパス（末尾に / が必要）。例: /ドメイン/public_html/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # サーバー上のDB設定や同期状態ファイルは触らない
          exclude: |
            **/config.php
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/.ftp-deploy-sync-state.json
