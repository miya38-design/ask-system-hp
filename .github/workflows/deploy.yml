name: Deploy to server (FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (FTP/FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          # Credentials via .netrc so no special-char/quoting issues in the command
          umask 077
          printf 'machine %s\n  login %s\n  password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            open -p $PORT \"$FTP_SERVER\";
            mirror --reverse --delete --verbose --parallel=2 \
              --exclude-glob config.php \
              --exclude-glob .ftp-deploy-sync-state.json \
              ./public/ \"$FTP_SERVER_DIR\";
          "
          rm -f "$HOME/.netrc"
