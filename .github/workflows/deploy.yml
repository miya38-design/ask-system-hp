name: Deploy to server (FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (FTP/FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -u
          PORT="${FTP_PORT:-21}"
          DOMAIN="asksystem.jp"
          umask 077
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

          # A transfer to this server can end early: on 2026-10-22 company.html was
          # left at 0 bytes and stayed that way until the next deploy. The server
          # returns 200 for a short file, so the visitor just gets a blank page.
          #
          # use-temp-file is what stops that reaching visitors: the upload goes to a
          # temporary name and is renamed over the live file only once it completes,
          # so a broken transfer leaves the previous copy in place instead of a
          # truncated one. clobber overwrites rather than trying to resume, which is
          # what corrupts a file that is already short. Transfers run one at a time;
          # --parallel=2 was in use when it happened.
          SETTINGS="set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 5; set net:timeout 30; set net:reconnect-interval-base 5; set xfer:clobber on; set xfer:use-temp-file true; set xfer:temp-file-name .in.*.tmp;"

          # Excluded paths are neither uploaded nor deleted. tsunagi-meter/ and
          # linebot/ (the internal LINE bot's webhook) are separate apps uploaded
          # by hand; without the exclude, --delete wipes them.
          EXCLUDES="--exclude-glob config.php --exclude-glob .ftp-deploy-sync-state.json --exclude-glob tsunagi-meter/ --exclude-glob linebot/"

          # Detect the real document root: <domain>/public_html if present, else <domain>/
          lftp -c "$SETTINGS open -p $PORT \"$FTP_SERVER\"; cls -1 \"$DOMAIN/\";" > list.txt 2>/dev/null || true
          if grep -qiE '(^|/)public_html/?$' list.txt; then
            TARGET="$DOMAIN/public_html"
          else
            TARGET="$DOMAIN"
          fi
          echo "Deploy target: '$TARGET'"

          # lftp can exit non-zero on benign verbose/delete messages, so success is
          # judged below by what the site actually serves, not by this exit code.
          set +e
          lftp -c "
            $SETTINGS
            open -p $PORT \"$FTP_SERVER\";
            mirror --reverse --delete $EXCLUDES ./public/ \"$TARGET\";
          " > lftp.out 2>&1
          echo "===== lftp output ====="
          cat lftp.out || true

          # Compare what the site serves against the repository. Checking that a
          # file exists is not enough -- a truncated upload is still a file. The
          # query string is there to miss the nginx cache and reach the origin.
          list_short_files() {
            tag="$1"
            : > short.txt
            while IFS= read -r f; do
              rel="${f#public/}"
              loc=$(wc -c < "$f" | tr -d " ")
              rem=$(curl -sS -o /dev/null -w "%{size_download}" --max-time 30 "https://$DOMAIN/$rel?cb=${GITHUB_RUN_ID}-${tag}" || echo ERR)
              if [ "$loc" != "$rem" ]; then
                # To stderr: the caller captures stdout, which carries only the count.
                echo "  short: /$rel  served=$rem expected=$loc" >&2
                echo "$rel" >> short.txt
              fi
            done < <(find public -type f \( -name "*.html" -o -name "*.xml" -o -name "*.txt" \) ! -path "*/api/*")
            wc -l < short.txt | tr -d " "
          }

          # Send the short ones again, one at a time, and look once more. Three
          # rounds: a single flaky transfer should not need the whole run repeating.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "===== verify pass $attempt ====="
            n=$(list_short_files "$attempt")
            if [ "$n" -eq 0 ]; then
              break
            fi
            echo "$n file(s) short; uploading them again"
            while IFS= read -r rel; do
              d=$(dirname "$rel")
              [ "$d" = "." ] && d=""
              lftp -c "$SETTINGS open -p $PORT \"$FTP_SERVER\"; put -O \"$TARGET/$d\" \"public/$rel\";" >> lftp.repair.out 2>&1
            done < short.txt
            attempt=$((attempt + 1))
          done

          # The loop re-uploads and then moves on, so the last round's repair has
          # not been looked at yet. Check once more before calling it a failure.
          if [ "$n" -ne 0 ]; then
            echo "===== final verify ====="
            n=$(list_short_files final)
          fi
          set -e
          rm -f "$HOME/.netrc"

          if [ "$n" -ne 0 ]; then
            echo "===== repair output ====="
            cat lftp.repair.out || true
            while IFS= read -r rel; do echo "::error::/$rel is not served at its full length"; done < short.txt
            echo "Deploy failed: $n file(s) are still short after 3 attempts."
            exit 1
          fi
          echo "Deploy verified: every page is served at its full length."
