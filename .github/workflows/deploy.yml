name: Deploy to server (FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (FTP/FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -u
          PORT="${FTP_PORT:-21}"
          DOMAIN="asksystem.jp"
          umask 077
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          SETTINGS="set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 2; set net:timeout 25;"

          # Detect the real document root: <domain>/public_html if present, else <domain>/
          lftp -c "$SETTINGS open -p $PORT \"$FTP_SERVER\"; cls -1 \"$DOMAIN/\";" > list.txt 2>/dev/null || true
          if grep -qiE '(^|/)public_html/?$' list.txt; then
            TARGET="$DOMAIN/public_html"
          else
            TARGET="$DOMAIN"
          fi
          echo "Deploy target: '$TARGET'"

          # Upload (lftp can exit non-zero on benign verbose/delete messages; we
          # judge success separately by verifying a key file below).
          # Excluded paths are neither uploaded nor deleted. tsunagi-meter/ and
          # linebot/ (the internal LINE bot's webhook) are separate apps uploaded
          # by hand; without the exclude, --delete wipes them.
          set +e
          lftp -c "
            $SETTINGS
            open -p $PORT \"$FTP_SERVER\";
            mirror --reverse --delete --parallel=2 \
              --exclude-glob config.php \
              --exclude-glob .ftp-deploy-sync-state.json \
              --exclude-glob tsunagi-meter/ \
              --exclude-glob linebot/ \
              ./public/ \"$TARGET\";
          " > lftp.out 2>&1
          echo "===== lftp output ====="
          cat lftp.out || true

          # Second pass. A transfer can end early and leave a file truncated --
          # company.html was served as 0 bytes on 2026-10-22 this way -- and the
          # server still answers 200 for it, so nothing downstream notices.
          # mirror compares size as well as time, so a short file is sent again.
          lftp -c "
            $SETTINGS
            open -p $PORT \"$FTP_SERVER\";
            mirror --reverse --delete \
              --exclude-glob config.php \
              --exclude-glob .ftp-deploy-sync-state.json \
              --exclude-glob tsunagi-meter/ \
              --exclude-glob linebot/ \
              ./public/ \"$TARGET\";
          " > lftp2.out 2>&1
          echo "===== lftp output (second pass) ====="
          cat lftp2.out || true

          if lftp -c "$SETTINGS open -p $PORT \"$FTP_SERVER\"; cls \"$TARGET/index.html\";" > /dev/null 2>&1; then
            ok=1
          else
            ok=0
          fi
          set -e
          rm -f "$HOME/.netrc"

          if [ "$ok" -ne 1 ]; then
            echo "Deployment verification failed (index.html not found at $TARGET)."
            tail -n 25 lftp.out | while IFS= read -r l; do [ -n "$l" ] && echo "::error::${l}"; done
            exit 1
          fi
          echo "Upload finished for https://$DOMAIN/"

      - name: Check every page is served at its full length
        run: |
          set -u
          DOMAIN="asksystem.jp"
          # Confirming a file exists is not enough: a truncated upload is still a
          # file, and the server returns 200 with Content-Length: 0. Compare the
          # served length against the repository instead.
          # The query string is there to miss the nginx cache and reach the origin.
          fail=0
          while IFS= read -r f; do
            rel="${f#public/}"
            loc=$(wc -c < "$f" | tr -d " ")
            rem=$(curl -sS -o /dev/null -w "%{size_download}" --max-time 30                   "https://$DOMAIN/$rel?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || echo ERR)
            if [ "$loc" != "$rem" ]; then
              echo "::error::/$rel is $rem bytes, expected $loc"
              fail=$((fail+1))
            fi
          done < <(find public -type f \( -name "*.html" -o -name "*.xml" -o -name "*.txt" \) ! -path "*/api/*")

          if [ "$fail" -ne 0 ]; then
            echo "$fail file(s) were not served intact. Re-run this workflow to upload them again."
            exit 1
          fi
          echo "Deploy verified: every page is served at its full length."
