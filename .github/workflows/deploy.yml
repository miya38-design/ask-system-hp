name: Deploy to server (FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (FTP/FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -u
          PORT="${FTP_PORT:-21}"
          umask 077
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          set +e
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 25;
            open -p $PORT \"$FTP_SERVER\";
            mirror --reverse --delete --verbose --parallel=2 \
              --exclude-glob config.php \
              --exclude-glob .ftp-deploy-sync-state.json \
              ./public/ \"$FTP_SERVER_DIR\";
          " > lftp.out 2>&1
          code=$?
          set -e
          echo "===== lftp output (exit $code) ====="
          cat lftp.out || true
          rm -f "$HOME/.netrc"
          if [ "$code" -ne 0 ]; then
            # Surface the real lftp error as annotations (readable via the API)
            tail -n 25 lftp.out | while IFS= read -r l; do [ -n "$l" ] && echo "::error::${l}"; done
            exit 1
          fi
