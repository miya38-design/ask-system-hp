<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>入退室受付｜ASKデジタルアカデミー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root{--blue:#1f5fbf;--green:#2bb24c;--ink:#1f2735;--muted:#6b7280;--line:#e5e9ef;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#0a1020;min-height:100vh;}
  .topbar{background:#111c34;border-bottom:1px solid rgba(255,255,255,.1);}
  .topbar .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;}
  .topbar img{height:34px;} .topbar a{color:#c6d2e6;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.15);padding:7px 14px;border-radius:999px;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 18px 50px;color:#eef3fc;}
  h1{font-size:20px;font-weight:900;margin-bottom:6px;}
  p.sub{color:#8496b6;font-size:13px;margin-bottom:18px;}
  .camwrap{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-height:60vh;margin:0 auto;}
  video{width:100%;height:100%;object-fit:cover;display:block;}
  .frame{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.7);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.25);transition:border-color .12s;}
  .frame.hit{border-color:#ffd54a;}

  /* 読み取り直後、通信の返事を待つ間の表示 */
  .checking{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(10,16,32,.86);color:#ffd54a;font-weight:800;font-size:14px;
    padding:9px 18px;border-radius:999px;display:none;align-items:center;gap:8px;white-space:nowrap;
  }
  .checking.show{display:inline-flex;}
  .checking .dot{width:9px;height:9px;border-radius:50%;background:#ffd54a;animation:blink .7s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* 結果ポップアップ（全画面）*/
  .popup{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(4,8,18,.55);backdrop-filter:blur(3px);
  }
  .popup.show{display:flex;animation:fade .12s ease;}
  .popup .box{
    width:100%;max-width:520px;border-radius:26px;padding:40px 28px;text-align:center;color:#fff;
    box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .22s cubic-bezier(.2,1.3,.4,1);
  }
  .popup.in  .box{background:linear-gradient(135deg,#17843b,#31c257);}
  .popup.out .box{background:linear-gradient(135deg,#123c7a,#2b7de0);}
  .popup.err .box{background:linear-gradient(135deg,#8d1327,#d33b53);}
  .popup .icon{font-size:72px;line-height:1;margin-bottom:10px;}
  .popup .name{font-size:38px;font-weight:900;line-height:1.25;word-break:break-word;}
  .popup .verb{font-size:26px;font-weight:900;margin-top:10px;}
  .popup .time{font-size:20px;font-weight:700;opacity:.92;margin-top:6px;}
  .popup .msg{font-size:21px;font-weight:800;line-height:1.7;}
  .popup .tap{font-size:13px;opacity:.8;margin-top:22px;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  #loading{padding:60px;text-align:center;color:#8496b6;}
  .hint{color:#8496b6;font-size:13px;margin-top:16px;text-align:center;line-height:1.8;}
  .sound-hint{
    display:none;margin-top:14px;background:#3a2d06;border:1px solid #6b5410;color:#ffd54a;
    padding:12px 14px;border-radius:12px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;
  }
  .sound-hint.show{display:block;}
  .stat{margin-top:14px;text-align:center;color:#8496b6;font-size:12px;}
  @media (max-width:480px){
    .popup .name{font-size:30px;} .popup .verb{font-size:22px;} .popup .icon{font-size:60px;}
  }
</style>
</head>
<body>
  <div class="topbar"><div class="inner">
    <img src="assets/images/logo.png" alt="ASKデジタルアカデミー" width="120" height="34">
    <a href="admin.html">コンソールへ</a>
  </div></div>

  <div id="loading">読み込み中…</div>

  <div class="wrap" id="content" hidden>
    <h1>入退室受付</h1>
    <p class="sub">生徒さんのQRコードをカメラにかざしてください（入室→退室を自動で切替）。</p>
    <div class="camwrap">
      <video id="video" playsinline muted></video>
      <div class="frame" id="frame"></div>
      <div class="checking" id="checking"><span class="dot"></span>照合中…</div>
    </div>
    <div class="sound-hint" id="sound-hint">🔇 画面を1回タップすると、読み取り音が鳴るようになります</div>
    <p class="hint">このページは受付端末で開いたままにしてください。<br>カメラの使用を許可する必要があります。</p>
    <p class="stat" id="stat"></p>
  </div>

  <!-- 結果ポップアップ -->
  <div class="popup" id="popup">
    <div class="box">
      <div class="icon" id="p-icon"></div>
      <div id="p-body"></div>
      <div class="tap">画面をタップすると閉じます</div>
    </div>
  </div>

<script>
const API='api/';
const api=(u,o)=>fetch(API+u,Object.assign({credentials:'same-origin'},o)).then(r=>r.json());

/* ── 調整用のつまみ ───────────────────────────────
   DECODE_MAX_EDGE: 解読に使う画像の長辺。カメラの生フレーム(1280〜1920px)を
     そのまま jsQR に渡すと1フレーム50〜90msかかる。縮小してから解読すると
     3〜4倍速くなる。ここが読み取り速度に一番効く。
     ただし縮小しすぎると「遠くにかざしたカード」を取りこぼす。実測では
     フレームの12%サイズのQR（カードを離して持った状態）が640では読めず、
     800なら読めたため800にしている。640に下げるとさらに数ms速くなるが、
     読み取れる距離が一段狭くなる。
   SAME_CARD_MS : 同じカードを続けて読んだときに無視する時間（二重打刻の防止）
   NEXT_CARD_MS : 別のカードを読めるようになるまでの時間                     */
const DECODE_MAX_EDGE = 800;
const SAME_CARD_MS    = 3500;
const NEXT_CARD_MS    = 600;

let lastToken='', lastAt=0, busy=false, scanCount=0;

api('auth.php?action=me').then(d=>{
  if(!d||!d.user){ location.replace('login.html'); return; }
  if(d.user.role!=='instructor'){ location.replace('mypage.html'); return; }
  document.getElementById('loading').hidden=true;
  document.getElementById('content').hidden=false;
  initAudio();
  startCamera();
}).catch(()=>location.replace('login.html'));

/* ── 音 ─────────────────────────────────────────
   AudioContext はユーザー操作なしでは鳴らないブラウザ（iOS Safari 等）が
   あるため、1つだけ作って使い回し、最初のタップで resume する。         */
let actx=null;
function initAudio(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended'){
      document.getElementById('sound-hint').classList.add('show');
      const unlock = () => {
        actx.resume().then(()=>{
          document.getElementById('sound-hint').classList.remove('show');
          tone([{f:880,d:.07}]);   // 鳴るようになったことを知らせる
        }).catch(()=>{});
      };
      document.addEventListener('pointerdown', unlock, {once:true});
      document.addEventListener('keydown', unlock, {once:true});
    }
  }catch(e){ /* 音が出せない端末でも動作は継続する */ }
}

/** 音を順番に鳴らす。steps = [{f:周波数, d:長さ秒, type:波形}] */
function tone(steps){
  if(!actx || actx.state !== 'running') return;
  let t = actx.currentTime;
  for(const s of steps){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = s.type || 'sine';
    o.frequency.setValueAtTime(s.f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.012);        // 頭のプチッを防ぐ
    g.gain.exponentialRampToValueAtTime(0.0001, t + s.d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + s.d + 0.02);
    t += s.d;
  }
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

const SOUND = {
  tick : ()=>{ tone([{f:1320,d:.05}]); buzz(20); },                          // QRを認識した瞬間
  in   : ()=>{ tone([{f:880,d:.11},{f:1318,d:.20}]); buzz(60); },            // 入室：上がる
  out  : ()=>{ tone([{f:1318,d:.11},{f:880,d:.20}]); buzz(60); },            // 退室：下がる
  err  : ()=>{ tone([{f:220,d:.16,type:'square'},{f:165,d:.30,type:'square'}]); buzz([80,60,80]); },
};

/* ── カメラと読み取り ───────────────────────────── */
const video=document.getElementById('video');
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const frameEl=document.getElementById('frame');

async function startCamera(){
  if(typeof jsQR === 'undefined'){ showErr('QR読取ライブラリの読み込みに失敗しました。通信環境をご確認のうえ、ページを再読み込みしてください。'); return; }
  try{
    // 解像度を指定しないと端末によっては4Kで流れてきて、縮小処理まで重くなる
    const stream=await navigator.mediaDevices.getUserMedia({video:{
      facingMode:'environment',
      width:{ideal:1280}, height:{ideal:720}
    }});
    video.srcObject=stream;
    video.setAttribute('playsinline','');
    await video.play();
    requestAnimationFrame(tick);
  }catch(e){ showErr('カメラを起動できませんでした。ブラウザのカメラ許可をご確認ください（PCは前面カメラでもOK）。'); }
}

function tick(){
  try{
    if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth>0){
      // 長辺 DECODE_MAX_EDGE まで縮小してから解読する
      const scale = Math.min(1, DECODE_MAX_EDGE / Math.max(video.videoWidth, video.videoHeight));
      const w = Math.round(video.videoWidth * scale);
      const h = Math.round(video.videoHeight * scale);
      if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
      ctx.drawImage(video,0,0,w,h);
      const img=ctx.getImageData(0,0,w,h);
      // 印刷・画面表示どちらも黒地に白ではないので、反転探索は不要（約2倍速くなる）
      const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(code && code.data){ onScan(code.data.trim()); }
    }
  }catch(e){ /* 1フレームの失敗は無視して継続 */ }
  requestAnimationFrame(tick);
}

async function onScan(token){
  const now=Date.now();
  if(busy) return;
  if(token===lastToken && now-lastAt<SAME_CARD_MS) return; // 同一QRの連続読取を抑制
  lastToken=token; lastAt=now; busy=true;

  // 通信を待つ前に「読み取れた」ことを知らせる
  SOUND.tick();
  frameEl.classList.add('hit');
  document.getElementById('checking').classList.add('show');

  try{
    const d=await api('checkin.php?action=scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qr_token:token})});
    if(d.ok){ showResult(d); } else { showErr(d.error||'記録できませんでした。'); }
  }catch(e){ showErr('通信エラーが発生しました。もう一度かざしてください。'); }
  finally{
    document.getElementById('checking').classList.remove('show');
    frameEl.classList.remove('hit');
    setTimeout(()=>{busy=false;}, NEXT_CARD_MS);
  }
}

/* ── 結果表示 ───────────────────────────────────── */
const popup=document.getElementById('popup');

function openPopup(kind, icon, html, ms){
  popup.className='popup show '+kind;
  document.getElementById('p-icon').textContent=icon;
  document.getElementById('p-body').innerHTML=html;
  clearTimeout(openPopup._t);
  openPopup._t=setTimeout(closePopup, ms);
}
function closePopup(){ popup.className='popup'; }
popup.addEventListener('click', closePopup);

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showResult(d){
  const isIn = d.type==='in';
  isIn ? SOUND.in() : SOUND.out();
  openPopup(
    isIn?'in':'out',
    isIn?'✓':'👋',
    '<div class="name">'+esc(d.student)+' さん</div>'+
    '<div class="verb">'+(isIn?'入室しました':'退室しました')+'</div>'+
    '<div class="time">'+esc(d.time)+'</div>',
    2600
  );
  scanCount++;
  document.getElementById('stat').textContent='本日この端末での読み取り：'+scanCount+'件';
}

function showErr(m){
  SOUND.err();
  // エラーは読み直しが要るので、同じカードでもすぐ再スキャンできるようにする
  lastToken='';
  openPopup('err','✕', '<div class="msg">'+esc(m)+'</div>', 4000);
}
</script>
</body>
</html>
