<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ｜ASKデジタルアカデミー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--blue:#1f5fbf;--blue-dark:#16498f;--blue-soft:#e8f1fb;--green:#2bb24c;--ink:#1f2735;--muted:#6b7280;--line:#e5e9ef;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#f5f8fc;min-height:100vh;}
  .topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .topbar .inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;}
  .topbar img{height:38px;width:auto;}
  .btn-logout{border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer;}
  .btn-logout:hover{background:#f2f5f9;color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px;}
  .hello{font-size:24px;font-weight:900;margin-bottom:6px;}
  .role{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark);margin-bottom:24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 6px 18px rgba(22,73,143,.05);}
  .card h2{font-size:16px;font-weight:900;color:var(--blue-dark);margin-bottom:14px;}
  .card.full{grid-column:1 / -1;}
  .lv{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .lv .n{font-size:40px;font-weight:900;color:var(--blue);line-height:1;}
  .bar{height:12px;border-radius:999px;background:#eef2f7;overflow:hidden;}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,#2b7de0,#2bb24c);}
  .exp-meta{font-size:13px;color:var(--muted);margin-top:8px;}
  .stamps{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .stamp{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px dashed #d3dce6;color:#cbd5e1;}
  .stamp.on{background:#fff7e6;border:2px solid #ffcf6b;color:#f59e0b;}
  .stamp-total{font-size:14px;color:var(--muted);margin-top:10px;}
  .list{list-style:none;}
  .list li{padding:11px 2px;border-bottom:1px dashed #e6ebf2;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .list li:last-child{border-bottom:0;}
  .st{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;}
  .st-open{background:#eafaef;color:#1f7a37;} .st-few{background:#fff4e2;color:#b26a00;}
  .st-full{background:#fdecef;color:#c93866;} .st-closed{background:#eef2f7;color:#6b7280;}
  .msg-list li{display:block;cursor:pointer;}
  .msg-head{display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .msg-item .t{font-weight:700;}
  .msg-body{margin-top:10px;color:#4a5568;font-size:14px;line-height:1.85;background:#f7fafd;border:1px solid #e6ebf2;border-radius:8px;padding:12px 14px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;margin-right:6px;}
  .empty{color:var(--muted);font-size:14px;}
  .kid{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .kid h3{font-size:16px;font-weight:900;margin-bottom:8px;}
  .kid .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:#4a5568;}
  .kid .meta b{color:var(--blue-dark);}
  .btn-mini{border:1px solid var(--line);background:#fff;color:var(--blue-dark);font-family:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;}
  .btn-mini:hover{background:#eef5fc;}
  .abs-input{width:100%;padding:9px 11px;font-size:15px;font-family:inherit;border:1.5px solid #d3dce6;border-radius:8px;background:#fff;margin-top:4px;}
  .foot{margin-top:26px;text-align:center;font-size:13px;}
  .foot a{color:var(--blue);font-weight:700;text-decoration:none;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  #loading{padding:60px 0;text-align:center;color:var(--muted);}
</style>
</head>
<body>
  <div class="topbar">
    <div class="inner">
      <a href="index.html"><img src="assets/images/logo.png" alt="ASKデジタルアカデミー"></a>
      <button class="btn-logout" id="logout">ログアウト</button>
    </div>
  </div>

  <div id="loading">読み込み中…</div>
  <div class="wrap" id="content" hidden></div>

<script>
const API = 'api/';
const ROLE_LABEL = {parent:'保護者', student:'生徒', instructor:'講師（管理者）'};
const SCH = {open:['受付中','st-open'], few:['残りわずか','st-few'], full:['満席','st-full'], closed:['休講','st-closed']};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = (u, o) => fetch(API + u, Object.assign({credentials:'same-origin'}, o)).then(r => r.json());
const fmt = s => s ? String(s).slice(0,10) : '';

function stampCard(stamps){
  const shown = Math.min(stamps, 10);
  let dots = '';
  for (let i=0;i<10;i++) dots += `<div class="stamp ${i<shown?'on':''}">${i<shown?'★':''}</div>`;
  return `<div class="stamps">${dots}</div><div class="stamp-total">獲得スタンプ：<b>${stamps}</b> 個</div>`;
}

function levelCard(s){
  const exp=Number(s.exp)||0, next=Number(s.exp_to_next)||100;
  const pct=Math.max(0,Math.min(100,Math.round(exp/next*100)));
  return `<div class="lv"><span class="n">Lv.${Number(s.level)||1}</span></div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="exp-meta">EXP ${exp} / ${next}（次のレベルまで ${Math.max(0,next-exp)}）</div>`;
}

function scheduleList(items){
  if (!items.length) return '<p class="empty">予定はまだありません。</p>';
  return '<ul class="list">' + items.map(s => {
    const [lbl,cls] = SCH[s.status] || [s.status,''];
    return `<li><span>${fmt(s.date)}　${esc(s.title||'')}</span><span class="st ${cls}">${lbl}</span></li>`;
  }).join('') + '</ul>';
}

function messageList(items){
  if (!items.length) return '<p class="empty">お知らせはありません。</p>';
  return '<ul class="list msg-list">' + items.map(m =>
    `<li class="msg-item" data-id="${m.id}">
       <div class="msg-head"><span class="t">${Number(m.is_read)?'':'<span class="dot"></span>'}${esc(m.title)}</span><span class="empty">${fmt(m.created_at)}</span></div>
       <div class="msg-body" hidden>${esc(m.body).replace(/\n/g,'<br>')}</div>
     </li>`
  ).join('') + '</ul>';
}

async function loadStudent(u){
  const [att, sch, msg] = await Promise.all([
    api('attendance.php?action=my'),
    api('schedules.php?action=list'),
    api('messages.php?action=my'),
  ]);
  const s = (att.ok && att.summary) ? att.summary : {level:u.level,exp:u.exp,exp_to_next:u.exp_to_next,stamps:0};
  return `<div class="grid">
    <div class="card"><h2>学習レベル</h2>${levelCard(s)}</div>
    <div class="card"><h2>スタンプカード</h2>${stampCard(s.stamps||0)}</div>
    <div class="card"><h2>入退室用QRコード</h2>
      <div id="qrbox" style="display:flex;justify-content:center;padding:8px;"></div>
      <p class="empty" style="text-align:center;">受付でこのQRをかざしてください。</p>
    </div>
    <div class="card"><h2>スケジュール</h2>${scheduleList(sch.schedules||[])}</div>
    <div class="card full"><h2>お知らせ</h2>${messageList(msg.messages||[])}</div>
  </div>`;
}

async function loadParent(){
  const [fam, sch, msg] = await Promise.all([
    api('family.php?action=children'),
    api('schedules.php?action=list'),
    api('messages.php?action=my'),
  ]);
  const kids = (fam.children||[]);
  const kidsHtml = kids.length ? kids.map(k => {
    const next=Number(k.exp_to_next)||100, exp=Number(k.exp)||0, pct=Math.max(0,Math.min(100,Math.round(exp/next*100)));
    return `<div class="kid" data-kid="${k.id}">
      <h3>${esc(k.display_name)}</h3>
      <div class="meta"><span>レベル <b>Lv.${Number(k.level)||1}</b></span>
        <span>スタンプ <b>${k.stamps||0}</b> 個</span>
        <span>最終出席 <b>${k.last_attended?fmt(k.last_attended):'—'}</b></span></div>
      <div class="bar" style="margin-top:10px;"><span style="width:${pct}%"></span></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-mini kid-qr" data-id="${k.id}">入退室QRを表示</button>
        <button class="btn-mini kid-absence" data-id="${k.id}">欠席を連絡</button>
      </div>
      <div class="kid-qrbox" id="qrbox-${k.id}" style="display:none;justify-content:center;padding:12px;"></div>
      <div class="abs-form" id="abs-${k.id}" style="display:none;margin-top:10px;background:#f7fafd;border:1px solid #e6ebf2;border-radius:10px;padding:14px;">
        <label style="font-size:12px;font-weight:700;color:#33404f;">欠席する日</label>
        <input type="date" class="abs-input abs-date">
        <div style="margin-top:12px;display:flex;align-items:center;gap:10px;">
          <button class="btn-mini abs-send" data-id="${k.id}" style="background:var(--blue);color:#fff;border-color:var(--blue);">欠席を連絡する</button>
          <span class="abs-msg" style="font-size:13px;font-weight:700;"></span>
        </div>
      </div>
    </div>`;
  }).join('') : '<p class="empty">お子さまのアカウントが登録されると、ここに表示されます。</p>';
  return `<div class="grid">
    <div class="card full"><h2>お子さまの状況</h2>${kidsHtml}</div>
    <div class="card full"><h2>LINE連携</h2><div id="linebox"><p class="empty">読み込み中…</p></div></div>
    <div class="card"><h2>スケジュール</h2>${scheduleList(sch.schedules||[])}</div>
    <div class="card"><h2>お知らせ</h2>${messageList(msg.messages||[])}</div>
  </div>`;
}

function loadInstructor(){
  return `<div class="grid">
    <div class="card full">
      <h2>講師メニュー</h2>
      <p style="margin-bottom:14px;color:#4a5568;font-size:14px;">アカウント管理・出席入力・スケジュール・お知らせ配信ができます。</p>
      <a href="admin.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#1f5fbf,#2b7de0);text-decoration:none;">講師コンソールを開く →</a>
    </div>
  </div>`;
}

async function render(u){
  let inner = `<div class="hello">こんにちは、${esc(u.display_name)} さん</div>
               <span class="role">${ROLE_LABEL[u.role]||u.role}</span>`;
  if (u.role === 'student') inner += await loadStudent(u);
  else if (u.role === 'parent') inner += await loadParent();
  else inner += loadInstructor();
  inner += `<div class="foot"><a href="index.html">← アカデミートップへ戻る</a></div>`;
  const c = document.getElementById('content');
  c.innerHTML = inner;
  c.hidden = false;
  document.getElementById('loading').hidden = true;

  // 生徒：入退室用QRを描画
  if (u.role === 'student') {
    try {
      const q = await api('checkin.php?action=my_qr');
      const box = document.getElementById('qrbox');
      if (q.ok && box && window.QRCode) { new QRCode(box, {text: q.qr_token, width: 168, height: 168}); }
    } catch(e){}
  }
  // 保護者：LINE連携状態
  if (u.role === 'parent') {
    try {
      const s = await api('link.php?action=status');
      const box = document.getElementById('linebox');
      if (box) {
        if (s.linked) {
          box.innerHTML = '<p style="color:#1f7a37;font-weight:700;">✅ LINE連携済みです。入退室やお知らせがLINEに届きます。</p>';
        } else {
          const code = esc(s.code || '');
          const addUrl = esc(s.add_url || 'https://lin.ee/xaSJRVQ');
          const sendBtn = s.oa_id
            ? `<a href="https://line.me/R/oaMessage/${encodeURIComponent(s.oa_id)}/?${encodeURIComponent(s.code||'')}" target="_blank" rel="noopener"
                  style="display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:800;color:#fff;background:#06c755;text-decoration:none;">② このコードをLINEで送信</a>`
            : `<p style="font-size:13px;color:#4a5568;margin-top:4px;">② LINEのトークに上のコードを貼り付けて送信してください。</p>`;
          box.innerHTML =
            `<ol style="font-size:14px;color:#4a5568;line-height:1.9;padding-left:20px;margin-bottom:12px;">
               <li>「① 公式LINEを友だち追加」を押して友だち追加</li>
               <li>下のコードをコピー → LINEのトークに貼り付けて送信</li>
               <li>「連携しました」と返信が来れば完了</li>
             </ol>
             <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
               <div id="link-code" style="font-size:26px;font-weight:900;letter-spacing:5px;color:#16498f;background:#eef5fc;border:1px dashed #1f5fbf;border-radius:10px;padding:12px 18px;">${code}</div>
               <button id="copy-code" type="button" style="padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:999px;font-family:inherit;font-weight:700;cursor:pointer;">コードをコピー</button>
             </div>
             <div style="display:flex;gap:10px;flex-wrap:wrap;">
               <a href="${addUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:800;color:#fff;background:#06c755;text-decoration:none;">① 公式LINEを友だち追加</a>
               ${sendBtn}
             </div>
             <p style="font-size:12px;color:#8496b6;margin-top:10px;">※通知を受け取るにはこの連携が必要です。うまくいかない場合は教室までお問い合わせください。</p>`;
          const cp = document.getElementById('copy-code');
          if (cp) cp.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(s.code||''); cp.textContent='コピーしました'; setTimeout(()=>cp.textContent='コードをコピー',1500); } catch(e){}
          });
        }
      }
    } catch(e){}

    // お子さまのQR表示
    c.querySelectorAll('.kid-qr').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const box = document.getElementById('qrbox-'+id);
      if (!box) return;
      if (box.style.display !== 'none' && box.dataset.loaded) { box.style.display='none'; box.dataset.loaded=''; box.innerHTML=''; return; }
      const q = await api('checkin.php?action=child_qr&student_id='+encodeURIComponent(id));
      if (q.ok && window.QRCode) { box.innerHTML=''; new QRCode(box, {text:q.qr_token, width:168, height:168}); box.style.display='flex'; box.dataset.loaded='1'; }
    }));
    // 欠席連絡フォームの開閉
    c.querySelectorAll('.kid-absence').forEach(btn => btn.addEventListener('click', () => {
      const f = document.getElementById('abs-'+btn.dataset.id);
      if (f) f.style.display = f.style.display==='none' ? 'block' : 'none';
    }));
    // 欠席連絡の送信
    c.querySelectorAll('.abs-send').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const f = document.getElementById('abs-'+id);
      const date = f.querySelector('.abs-date').value;
      const out = f.querySelector('.abs-msg');
      if (!date) { out.style.color='#c93866'; out.textContent='日付を選んでください'; return; }
      btn.disabled = true;
      const d = await api('attendance.php?action=report_absence', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({student_id:id, date})});
      btn.disabled = false;
      if (d.ok) { out.style.color='#1f7a37'; out.textContent='欠席を連絡しました'; }
      else { out.style.color='#c93866'; out.textContent=d.error||'送信に失敗しました'; }
    }));
  }

  // お知らせクリックで既読
  c.querySelectorAll('.msg-item').forEach(li => li.addEventListener('click', async () => {
    const body = li.querySelector('.msg-body'); if (body) body.hidden = !body.hidden;
    const dot = li.querySelector('.dot');
    if (dot){ dot.remove(); try { await api('messages.php?action=mark_read', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: li.dataset.id})}); } catch(e){} }
  }));
}

api('auth.php?action=me')
  .then(d => { if (!d || !d.user) { location.replace('login.html'); return; } return render(d.user); })
  .catch(() => location.replace('login.html'));

document.getElementById('logout').addEventListener('click', async () => {
  try { await fetch(API + 'auth.php?action=logout', {method:'POST', credentials:'same-origin'}); } catch(e){}
  location.replace('login.html');
});
</script>
</body>
</html>
