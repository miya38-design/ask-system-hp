<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン｜ASKデジタルアカデミー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1f5fbf;--blue-dark:#16498f;--green:#2bb24c;--ink:#1f2735;--muted:#6b7280;--line:#e5e9ef;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:radial-gradient(900px 500px at 80% -10%,#e8f1fb,transparent 60%),radial-gradient(700px 400px at 0% 100%,#eafaef,transparent 60%),#f7fafd;}
  .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(22,73,143,.12);padding:36px 30px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center;}
  .brand img{height:56px;width:auto;}
  .brand h1{font-size:19px;font-weight:900;color:var(--blue-dark);}
  .brand p{font-size:13px;color:var(--muted);}
  label{display:block;font-size:13px;font-weight:700;color:#33404f;margin:16px 0 7px;}
  input{width:100%;padding:13px 14px;font-size:16px;font-family:inherit;border:1.5px solid #d3dce6;border-radius:10px;background:#fbfdff;transition:border-color .15s,box-shadow .15s;}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.12);}
  button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:999px;font-family:inherit;font-weight:800;font-size:16px;color:#fff;
         background:linear-gradient(135deg,var(--blue),#2b7de0);cursor:pointer;transition:transform .15s,filter .15s;}
  button:hover{transform:translateY(-1px);filter:brightness(1.05);}
  button:disabled{opacity:.6;cursor:default;transform:none;}
  .msg{margin-top:16px;padding:11px 14px;border-radius:9px;font-size:14px;font-weight:700;display:none;}
  .msg.err{display:block;background:#fdecef;border:1px solid #f6c4d5;color:#c93866;}
  .foot{margin-top:22px;text-align:center;font-size:13px;}
  .foot a{color:var(--blue);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/images/logo.png" alt="ASKデジタルアカデミー">
      <h1>マイページ ログイン</h1>
      <p>登録済みのメールアドレスでログインしてください</p>
    </div>
    <form id="login-form">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" name="email" autocomplete="email" required placeholder="you@example.com">
      <label for="password">パスワード</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required placeholder="パスワード">
      <button id="submit" type="submit">ログイン</button>
      <div class="msg err" id="msg"></div>
    </form>
    <div id="choose" style="display:none;margin-top:18px;">
      <p style="font-size:14px;font-weight:700;color:#33404f;margin-bottom:10px;">同じメールで複数のアカウントがあります。ログインする方を選んでください：</p>
      <div id="choose-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
    <div class="foot"><a href="index.html">← アカデミートップへ戻る</a></div>
  </div>

<script>
const API = 'api/auth.php';
const msg = document.getElementById('msg');
const btn = document.getElementById('submit');

// 既にログイン済みならマイページへ
fetch(API + '?action=me', {credentials:'same-origin'})
  .then(r => r.json())
  .then(d => { if (d && d.user) location.replace('mypage.html'); })
  .catch(()=>{});

const ROLE_LABEL = {parent:'保護者', student:'生徒', instructor:'講師'};

async function doLogin(accountId){
  msg.style.display = 'none';
  btn.disabled = true; btn.textContent = 'ログイン中…';
  const payload = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  };
  if (accountId) payload.account_id = accountId;
  try {
    const res = await fetch(API + '?action=login', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) { location.replace('mypage.html'); return; }
    if (data.choose) { showChooser(data.choose); return; }
    msg.textContent = data.error || 'ログインに失敗しました。';
    msg.className = 'msg err';
  } catch (err) {
    msg.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    msg.className = 'msg err';
  } finally {
    btn.disabled = false; btn.textContent = 'ログイン';
  }
}

function showChooser(list){
  const box = document.getElementById('choose');
  const cl = document.getElementById('choose-list');
  cl.innerHTML = list.map(a =>
    `<button type="button" data-id="${a.id}" style="text-align:left;padding:12px 14px;border:1.5px solid #d3dce6;border-radius:10px;background:#fbfdff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">
       ${a.display_name}（${ROLE_LABEL[a.role]||a.role}）</button>`).join('');
  cl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => doLogin(Number(b.dataset.id))));
  box.style.display = 'block';
}

document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('choose').style.display='none'; doLogin(0); });
</script>
</body>
</html>
