<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
<title>入退室カード｜ASKデジタルアカデミー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--blue:#1f5fbf;--blue-dark:#16498f;--green:#2bb24c;--ink:#1f2735;--muted:#6b7280;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#eef3f9;min-height:100vh;padding:24px;}
  .bar{max-width:520px;margin:0 auto 18px;display:flex;justify-content:space-between;gap:10px;}
  .bar a,.bar button{font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:999px;padding:10px 18px;border:1px solid #d3dce6;background:#fff;color:var(--blue-dark);text-decoration:none;}
  .bar .print{background:linear-gradient(135deg,var(--blue),#2b7de0);color:#fff;border:0;}
  #loading{max-width:520px;margin:0 auto;text-align:center;color:var(--muted);padding:40px;}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(22,73,143,.16);border:1px solid #dbe6f3;}
  .card-head{background:linear-gradient(135deg,#16498f,#1f5fbf 55%,#2b7de0);color:#fff;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .card-head .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;letter-spacing:.02em;}
  .card-head .logo img{height:34px;background:#fff;border-radius:8px;padding:3px;}
  .card-head .tag{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;}
  .card-body{padding:24px 22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;}
  .info .nm{font-size:30px;font-weight:900;line-height:1.2;}
  .info .nm .suf{font-size:16px;font-weight:700;color:var(--muted);margin-left:4px;}
  .info .meta{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .info .meta div{font-size:15px;}
  .info .meta .k{font-size:12px;font-weight:700;color:var(--muted);margin-right:8px;}
  .info .meta b{color:var(--blue-dark);}
  .qr{background:#fff;border:1px solid #e6ebf2;border-radius:12px;padding:10px;}
  .qr #qrbox{width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
  .card-foot{border-top:1px solid #eef2f7;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;}
  .hint{max-width:520px;margin:16px auto 0;color:var(--muted);font-size:12px;text-align:center;}
  @media print{
    body{background:#fff;padding:0;}
    .bar,.hint{display:none!important;}
    .card{box-shadow:none;border:1px solid #99a;margin:12mm auto;page-break-inside:avoid;}
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="mypage.html">← 戻る</a>
    <button class="print" onclick="window.print()">印刷する</button>
  </div>
  <div id="loading">読み込み中…</div>
  <div class="card" id="card" hidden>
    <div class="card-head">
      <div class="logo"><img src="assets/images/logo.png" alt="">ASKデジタルアカデミー</div>
      <div class="tag">入退室カード</div>
    </div>
    <div class="card-body">
      <div class="info">
        <div class="nm"><span id="c-name"></span><span class="suf">さん</span></div>
        <div class="meta">
          <div><span class="k">学年</span><b id="c-grade"></b></div>
          <div><span class="k">コース</span><b id="c-course"></b></div>
        </div>
      </div>
      <div class="qr"><div id="qrbox"></div></div>
    </div>
    <div class="card-foot"><span>受付でこのQRをかざしてください</span><span id="c-id"></span></div>
  </div>
  <p class="hint">※このカードのQRを受付端末で読み取ると、入退室が記録され、保護者のLINEへ通知されます。</p>

<script>
const API='api/';
const PLAN={'':'—','standard-a':'週2回（火・木）','standard-b':'週3回（月・水・金）','premium':'週5回（通い放題）'};
const api=(u)=>fetch(API+u,{credentials:'same-origin'}).then(r=>r.json());
const params=new URLSearchParams(location.search);
const sid=params.get('student_id')||'';

api('auth.php?action=me').then(d=>{
  if(!d||!d.user){ location.replace('login.html'); return; }
  return api('checkin.php?action=card'+(sid?('&student_id='+encodeURIComponent(sid)):''));
}).then(d=>{
  if(!d) return;
  if(!d.ok){ document.getElementById('loading').textContent='カードを表示できません（権限がありません）。'; return; }
  const c=d.card;
  document.getElementById('c-name').textContent=c.display_name;
  document.getElementById('c-grade').textContent=c.grade||'—';
  document.getElementById('c-course').textContent=PLAN[c.plan]||'—';
  document.getElementById('c-id').textContent='No. '+String(c.id).padStart(4,'0');
  new QRCode(document.getElementById('qrbox'),{text:c.qr_token,width:150,height:150});
  document.getElementById('loading').hidden=true;
  document.getElementById('card').hidden=false;
}).catch(()=>{ document.getElementById('loading').textContent='読み込みに失敗しました。'; });
</script>
</body>
</html>
