<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | ADA</title>
  <meta name="description" content="ADA会員専用マイページ。進捗、スケジュール、ミッション管理。">
  <link rel="stylesheet" href="css/style.css?v=202609081505">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

  <!-- Particle Canvas Background -->
  <canvas id="particle-canvas"></canvas>

  <!-- ========== Dashboard (Protected) ========== -->
  <div class="dashboard auth-protected" id="dashboard">

    <!-- Dashboard Header -->
    <header class="dash-header">
      <div class="container dash-header-inner">
        <a href="index.html" class="logo">
          <img src="assets/images/logo.png" alt="ADA" width="100" height="32">
        </a>
        <div class="dash-user">
          <div class="dash-avatar" id="dash-avatar">山</div>
          <div class="dash-user-info">
            <div class="user-name" id="user-name">山田 太郎</div>
            <div class="user-role" id="user-role">保護者</div>
          </div>
        </div>
        <button class="dash-logout" id="logout-btn">ログアウト</button>
      </div>
    </header>

    <!-- Dashboard Content -->
    <main class="container" style="padding-top: 1rem; padding-bottom: 4rem;">

      <!-- Tab Navigation -->
      <div class="dash-tabs">
        <button class="dash-tab active" data-panel="parent" data-role="parent">📊 保護者</button>
        <button class="dash-tab" data-panel="student">🎮 生徒</button>
        <button class="dash-tab" data-panel="instructor" data-role="instructor">👨‍🏫 講師</button>
      </div>

      <!-- ===== Parent Panel ===== -->
      <div class="dash-panel active" id="panel-parent">
        <div class="dash-grid">

          <!-- Progress Chart -->
          <div class="dash-card">
            <div class="dash-card-header">
              <h3>📈 進捗</h3>
            </div>
            <div class="chart-container">
              <canvas id="progress-chart"></canvas>
            </div>
          </div>

          <!-- Calendar -->
          <div class="dash-card">
            <div class="dash-card-header">
              <h3>📅 空席</h3>
            </div>
            <div class="calendar">
              <div class="calendar-header">
                <button class="calendar-nav-btn" onclick="void(0)">◀</button>
                <h4 id="calendar-title">2026年 3月</h4>
                <button class="calendar-nav-btn" onclick="void(0)">▶</button>
              </div>
              <div class="calendar-grid" id="calendar-grid">
                <!-- Generated by JS -->
              </div>
              <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; font-size: 0.75rem; color: var(--text-light);">
                <span><span class="availability open" style="font-weight:700;">○</span> 空き</span>
                <span><span class="availability limited" style="font-weight:700;">△</span> わずか</span>
                <span><span class="availability full" style="font-weight:700;">×</span> 満席</span>
              </div>
            </div>
          </div>

          <!-- Messages -->
          <div class="dash-card" style="grid-column: 1 / -1;">
            <div class="dash-card-header">
              <h3>💬 メッセージ</h3>
            </div>
            <div class="message-list" id="message-list">
              <!-- Generated by JS -->
            </div>
          </div>

          <!-- Mission List (moved from student panel) -->
          <div class="dash-card" style="grid-column: 1 / -1;">
            <div class="dash-card-header">
              <h3>✅ ミッション</h3>
            </div>
            <div id="mission-list-items">
              <!-- Generated by JS -->
            </div>
          </div>

        </div>
      </div>

      <!-- ===== Student Panel ===== -->
      <div class="dash-panel" id="panel-student">

        <!-- Level & EXP Status -->
        <div class="student-status">
          <div class="status-top">
            <div class="level-badge">
              <span class="lv-label">LV</span>
              <span class="lv-number" id="lv-number">12</span>
            </div>
            <div class="status-info">
              <h3 id="student-name">山田 花子</h3>
              <p class="exp-text" id="exp-text">EXP: 2450/3000</p>
            </div>
          </div>
          <div class="exp-bar-container">
            <div class="exp-bar-label">
              <span id="exp-current">2450</span>
              <span>次レベル: <span id="exp-next">3000</span></span>
            </div>
            <div class="exp-bar">
              <div class="exp-bar-fill" id="exp-fill" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div class="dash-grid">

          <!-- Stamp Card -->
          <div class="stamp-card">
            <h3>📌 スタンプ</h3>
            <div class="stamp-grid" id="stamp-grid">
              <!-- Generated by JS -->
            </div>
            <div class="stamp-progress" id="stamp-progress">7 / 10 出席</div>
          </div>

        </div>
      </div>

      <!-- ===== Instructor Panel ===== -->
      <div class="dash-panel" id="panel-instructor">
        <div class="instructor-header">
          <div class="instructor-info">
            <div class="instructor-avatar">👨‍🏫</div>
            <div>
              <h3 id="instructor-name">田中 一郎</h3>
              <p class="instructor-meta">担当: <span id="instructor-subjects">算数・国語・IT</span> ｜ <span id="instructor-area">八代市</span></p>
            </div>
          </div>
        </div>

        <div class="instructor-sections">
          <!-- Schedule Management -->
          <div class="dash-card instructor-card">
            <div class="dash-card-header">
              <h3>📅 スケジュール</h3>
            </div>
            <p class="instructor-card-desc">空席状況変更</p>
            <div class="schedule-manager">
              <div class="schedule-calendar">
                <div class="calendar-header">
                  <button class="calendar-nav-btn" id="sched-prev">◀</button>
                  <h4 id="sched-calendar-title">2026年 4月</h4>
                  <button class="calendar-nav-btn" id="sched-next">▶</button>
                </div>
                <div class="calendar-grid" id="sched-calendar-grid">
                  <!-- Generated by JS -->
                </div>
                <div class="schedule-legend">
                  <span><span class="availability open" style="font-weight:700;">○</span> 空き</span>
                  <span><span class="availability limited" style="font-weight:700;">△</span> わずか</span>
                  <span><span class="availability full" style="font-weight:700;">×</span> 満席</span>
                </div>
              </div>
              <!-- Edit panel -->
              <div class="schedule-edit-panel" id="schedule-edit-panel">
                <div class="edit-panel-placeholder" id="edit-panel-placeholder">
                  <span class="edit-placeholder-icon">📅</span>
                  <p>左で日付選択</p>
                </div>
                <div class="edit-panel-form" id="edit-panel-form" style="display:none;">
                  <h4 id="edit-date-title">—</h4>
                  <div class="status-selector">
                    <label>ステータス:</label>
                    <div class="status-options">
                      <button class="status-option" data-status="available">○ 空きあり</button>
                      <button class="status-option" data-status="limited">△ 残りわずか</button>
                      <button class="status-option" data-status="full">× 満席</button>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="edit-capacity">定員</label>
                    <input type="number" id="edit-capacity" min="1" max="30" value="10">
                  </div>
                  <div class="form-group">
                    <label for="edit-note">メモ</label>
                    <input type="text" id="edit-note" placeholder="例: テスト週間のため自習中心">
                  </div>
                  <button class="btn-save-schedule" id="btn-save-schedule">保存する</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Message Sending -->
          <div class="dash-card instructor-card">
            <div class="dash-card-header">
              <h3>✉️ 送信</h3>
            </div>
            <form class="message-form" id="message-form">
              <div class="form-group">
                <label for="msg-recipient">宛先</label>
                <select id="msg-recipient" required>
                  <option value="">選択してください...</option>
                  <!-- Generated by JS -->
                </select>
              </div>
              <div class="form-group">
                <label for="msg-body">メッセージ</label>
                <textarea id="msg-body" rows="5" placeholder="メッセージ..." required></textarea>
              </div>
              <div class="form-group">
                <label>テンプレート:</label>
                <div class="msg-templates">
                  <button type="button" class="msg-template-btn" data-template="本日の授業ではとても良い結果を出しました。この調子で頑張りましょう。">👍 好調</button>
                  <button type="button" class="msg-template-btn" data-template="次回の授業では、お子さまの筆記用具とノートをご用意ください。">📝 持ち物</button>
                  <button type="button" class="msg-template-btn" data-template="次回の授業日程についてご確認ください。">📅 日程</button>
                </div>
              </div>
              <button type="submit" class="btn-send-message" id="btn-send-message">
                <span class="btn-send-icon">✉️</span> 送信
              </button>
            </form>
          </div>

          <!-- Sent Messages -->
          <div class="dash-card instructor-card">
            <div class="dash-card-header">
              <h3>📨 送信済み</h3>
            </div>
            <div class="sent-message-list" id="sent-message-list">
              <!-- Generated by JS -->
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/particle.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-gate.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          AuthGate.logout();
        });
      }
    });
  </script>

</body>
</html>
